name: Code Web AI
on:
  workflow_dispatch:
jobs:
  code-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Cai dat Code-Server (Khong dung Docker)
        run: |
          curl -fsSL https://code-server.dev/install.sh | sh
          
      - name: Cau hinh Webview & Tat Trust
        run: |
          mkdir -p ~/.local/share/code-server/User
          echo '{"workbench.webview.externalBrowser": "default", "security.workspace.trust.enabled": false}' > ~/.local/share/code-server/User/settings.json
          echo 'auth: none' > ~/.config/code-server/config.yaml
          
      - name: Chay Code-Server
        run: |
          code-server --bind-addr 0.0.0.0:8443 &
          
      - name: Cai dat Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
      - name: Lay Link Truy Cap
        run: |
          echo "Khong can mat khau!"
          sleep 5
          cloudflared tunnel --url http://localhost:8443

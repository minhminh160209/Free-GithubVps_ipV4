name: Code Web AI
on:
  workflow_dispatch:
jobs:
  code-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Khoi chay VS Code Web
        run: |
          docker run -d --name=code-server \
            -e PUID=1000 -e PGID=1000 -e TZ=Etc/UTC \
            -e PASSWORD=123456 \
            -p 8443:8443 --shm-size="1gb" \
            lscr.io/linuxserver/code-server:latest

      - name: Cai dat Tieng Viet
        run: |
          # Đợi 10 giây để code-server khởi động
          sleep 10
          # Cài gói ngôn ngữ tiếng Việt
          docker exec code-server /app/code-server/bin/code-server --install-extension MS-CEINTL.vscode-language-pack-vi
          # Tạo file cấu hình mặc định ngôn ngữ là tiếng Việt
          echo '{"locale":"vi"}' > /tmp/settings.json
          docker cp /tmp/settings.json code-server:/config/data/User/settings.json
          # Khởi động lại để áp dụng
          docker restart code-server

      - name: Cai dat Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Lay Link Truy Cap
        run: |
          echo "Mat khau truy cap VS Code la: 123456"
          echo "Vui long doi 5-10 giay de lay link..."
          cloudflared tunnel --url http://localhost:8443

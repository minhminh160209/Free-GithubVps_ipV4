name: Code Web AI
on:
  workflow_dispatch:
jobs:
  code-server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Khoi chay VS Code Web
        run: |
          docker run -d --name=code-server \
            -e PUID=1000 -e PGID=1000 -e TZ=Etc/UTC \
            -e PASSWORD=123456 \
            -p 8443:8443 --shm-size="1gb" \
            lscr.io/linuxserver/code-server:latest

      - name: Cai dat Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Lay Link Truy Cap
        run: |
          echo "Mat khau truy cap VS Code la: 123456"
          echo "Vui long doi 5-10 giay de lay link..."
          cloudflared tunnel --url http://localhost:8443
